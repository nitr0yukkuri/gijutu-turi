<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">技術釣りのシステム構成</title>
  <desc id="desc">PCと手元のスマートフォンからCloud Runの釣りゲームへ接続し、釣果と図鑑データをCloudflare D1へ保存する。スマートフォンはタッチ操作を基本とし、対応端末ではモーション操作も選べる。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#168b83" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:"Yu Gothic UI","Meiryo",sans-serif;fill:#19363b}
      .eyebrow{font-size:16px;font-weight:700;letter-spacing:.06em;fill:#168b83}
      .title{font-size:36px;font-weight:700;letter-spacing:.01em}
      .subtitle{font-size:18px;fill:#60777a}
      .section{font-size:15px;font-weight:700;letter-spacing:.04em;fill:#60777a}
      .card{fill:#fff;stroke:#d7e3df;stroke-width:2}
      .server{fill:#eaf5f1;stroke:#b9d9d0;stroke-width:2}
      .db{fill:#fff8eb;stroke:#ead8b6;stroke-width:2}
      .heading{font-size:22px;font-weight:700}
      .body{font-size:17px;fill:#405b5f}
      .small{font-size:14px;fill:#60777a}
      .chip{fill:#e5f4f1}
      .chiptext{font-size:14px;font-weight:700;fill:#14786f}
      .optional{fill:#fff0e7}
      .optionaltext{font-size:14px;font-weight:700;fill:#a55d38}
      .link{fill:none;stroke:#168b83;stroke-width:2.5;marker-start:url(#arrow);marker-end:url(#arrow)}
      .divider{stroke:#d2e1dc;stroke-width:1.5}
      .note{fill:#f0f5f2}
      .notehead{font-size:15px;font-weight:700;fill:#168b83}
      .notetext{font-size:15px;fill:#526b6f}
    </style>
  </defs>

  <rect width="1440" height="840" fill="#f7faf8"/>
  <rect x="72" y="54" width="5" height="32" rx="2.5" fill="#168b83"/>
  <text x="92" y="77" class="eyebrow">技術釣り　/　システム構成</text>
  <text x="72" y="134" class="title">手元のスマホで参加、釣果はサーバーへ</text>
  <text x="72" y="169" class="subtitle">PCとスマートフォンを同じ釣り場につなぎ、ゲームの判定をサーバーに集約します。</text>

  <text x="72" y="226" class="section">操作する端末</text>
  <text x="550" y="226" class="section">釣りを進める</text>
  <text x="1175" y="310" class="section">釣果を残す</text>

  <rect x="72" y="248" width="350" height="176" rx="18" class="card"/>
  <rect x="72" y="248" width="7" height="176" rx="3.5" fill="#55aaa0"/>
  <rect x="101" y="274" width="40" height="30" rx="4" fill="none" stroke="#168b83" stroke-width="2.5"/>
  <path d="M111 310h20m-10-6v6m-13 4h26" fill="none" stroke="#168b83" stroke-width="2.5" stroke-linecap="round"/>
  <text x="156" y="297" class="heading">PCブラウザー</text>
  <text x="101" y="348" class="body">3Dの海・魚・竿を表示</text>
  <text x="101" y="378" class="small">PCからも釣りを操作できます</text>

  <rect x="72" y="450" width="350" height="216" rx="18" class="card"/>
  <rect x="72" y="450" width="7" height="216" rx="3.5" fill="#55aaa0"/>
  <rect x="103" y="476" width="24" height="40" rx="5" fill="none" stroke="#168b83" stroke-width="2.5"/>
  <path d="M111 510h8" stroke="#168b83" stroke-width="2.5" stroke-linecap="round"/>
  <text x="145" y="501" class="heading">手元のスマートフォン</text>
  <text x="101" y="548" class="body">QRコードで同じ釣り場へ</text>
  <rect x="101" y="568" width="91" height="31" rx="15.5" class="chip"/>
  <text x="119" y="589" class="chiptext">タッチ操作</text>
  <rect x="201" y="568" width="188" height="31" rx="15.5" class="optional"/>
  <text x="216" y="589" class="optionaltext">モーション操作も選択可</text>
  <text x="101" y="633" class="small">釣り専用の機器は必要ありません</text>

  <path d="M422 335H550" class="link"/>
  <rect x="431" y="308" width="110" height="24" rx="12" fill="#f7faf8"/>
  <text x="439" y="325" class="small">操作と状態</text>
  <path d="M422 550H550" class="link"/>
  <rect x="427" y="523" width="118" height="24" rx="12" fill="#f7faf8"/>
  <text x="432" y="540" class="small">入力と状態</text>

  <rect x="550" y="248" width="520" height="418" rx="20" class="server"/>
  <text x="584" y="289" class="eyebrow">ゲームサーバー</text>
  <text x="584" y="326" class="heading">Google Cloud Run</text>
  <rect x="584" y="350" width="452" height="74" rx="12" fill="#fff" stroke="#d0e2dc" stroke-width="1.5"/>
  <text x="606" y="380" class="body" font-weight="700">Hono · HTTP API · WebSocket</text>
  <text x="606" y="405" class="small">入力をZodで検証し、両画面へ状態を配信</text>
  <rect x="584" y="442" width="452" height="165" rx="12" fill="#fff" stroke="#d0e2dc" stroke-width="1.5"/>
  <text x="606" y="478" class="body" font-weight="700">釣りのルール（20Hz）</text>
  <circle cx="612" cy="509" r="3.5" fill="#168b83"/><text x="627" y="515" class="body">魚の位置・泳ぎ・抵抗を更新</text>
  <circle cx="612" cy="542" r="3.5" fill="#168b83"/><text x="627" y="548" class="body">糸の張りと捕獲を判定</text>
  <circle cx="612" cy="575" r="3.5" fill="#168b83"/><text x="627" y="581" class="body">共通のゲーム状態を生成</text>
  <text x="584" y="637" class="small">ゲームの進行と判定をサーバー側で一元管理</text>

  <path d="M1070 464H1175" class="link"/>
  <rect x="1075" y="435" width="96" height="25" rx="12" fill="#f7faf8"/>
  <text x="1081" y="453" class="small">釣果・図鑑</text>

  <rect x="1175" y="332" width="210" height="264" rx="18" class="db"/>
  <ellipse cx="1280" cy="388" rx="28" ry="10" fill="#fff" stroke="#b98239" stroke-width="2"/>
  <path d="M1252 388v30c0 6 13 11 28 11s28-5 28-11v-30" fill="#fff" stroke="#b98239" stroke-width="2"/>
  <path d="M1252 403c0 6 13 11 28 11s28-5 28-11" fill="none" stroke="#b98239" stroke-width="2"/>
  <text x="1201" y="466" class="heading">Cloudflare D1</text>
  <line x1="1201" y1="484" x2="1359" y2="484" class="divider"/>
  <text x="1201" y="518" class="body">捕獲イベント</text>
  <text x="1201" y="548" class="body">プレイヤー別図鑑</text>
  <text x="1201" y="578" class="body">魚種カタログ</text>

  <rect x="72" y="716" width="1313" height="72" rx="14" class="note"/>
  <text x="98" y="746" class="notehead">データの寿命</text>
  <text x="220" y="746" class="notetext">図鑑と釣果はD1へ保存。進行中の釣りルームはCloud Run内にあり、再起動後には引き継がれません。</text>
  <text x="98" y="772" class="small">入力・ゲーム判定・描画・永続化の役割を分けています。</text>
</svg>
