name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "assets/**"
      - "vendor/**"
      - "package.json"
      - "package-lock.json"
      - "migrations/**"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify Cloudflare deployment bundle
        run: npx wrangler deploy --dry-run
      - name: Apply additive D1 migrations
        run: npx wrangler d1 migrations apply gijutu-turi-collections --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy to Cloudflare Workers
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/wrangler-deploy.log"
          npx wrangler deploy 2>&1 | tee "$deploy_log"
          worker_url="$(grep -m 1 -Eo 'https://[[:alnum:].-]+\.workers\.dev' "$deploy_log")"
          if [ -z "$worker_url" ]; then
            echo "Wrangler did not report a workers.dev URL." >&2
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test production Worker
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for endpoint in /health /ready; do
            curl --fail --show-error --silent --retry 8 --retry-delay 2 --retry-connrefused "$WORKER_URL$endpoint"
          done
          curl --fail --show-error --silent "$WORKER_URL/" -o "$RUNNER_TEMP/gijutu-turi-index.html"
          grep -qi '<html' "$RUNNER_TEMP/gijutu-turi-index.html"

