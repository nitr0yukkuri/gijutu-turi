name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "assets/**"
      - "vendor/**"
      - "package.json"
      - "package-lock.json"
      - "migrations/**"
      - "vite.config.ts"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify Cloudflare deployment bundle
        run: npx wrangler deploy --dry-run
      - name: Ensure workers.dev account subdomain
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKERS_DEV_SUBDOMAIN: nitr0yukkuri
        run: |
          set -euo pipefail
          account_id="$(node -e 'const fs = require("node:fs"); const config = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8")); process.stdout.write(config.account_id)')"
          api_url="https://api.cloudflare.com/client/v4/accounts/\${account_id}/workers/subdomain"
          response_file="$RUNNER_TEMP/workers-subdomain.json"

          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer \${CLOUDFLARE_API_TOKEN}" \
            "$api_url")"
          register_subdomain=false

          if [[ "$http_status" == "200" ]]; then
            current_subdomain="$(jq -r '.result.subdomain // empty' "$response_file")"
            if [[ "$current_subdomain" == "$WORKERS_DEV_SUBDOMAIN" ]]; then
              echo "workers.dev subdomain is already registered."
            elif [[ -n "$current_subdomain" ]]; then
              echo "An existing workers.dev subdomain is configured; refusing to replace it." >&2
              exit 1
            else
              register_subdomain=true
            fi
          elif [[ "$http_status" == "404" ]]; then
            register_subdomain=true
          else
            echo "Could not inspect the workers.dev subdomain (HTTP \${http_status})." >&2
            exit 1
          fi

          if [[ "$register_subdomain" == "true" ]]; then
            request_body="$(jq -cn --arg subdomain "$WORKERS_DEV_SUBDOMAIN" '{subdomain: $subdomain}')"
            http_status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request PUT \
              --header "Authorization: Bearer \${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "$request_body" \
              "$api_url")"
            if [[ "$http_status" != "200" ]] || ! jq -e --arg expected "$WORKERS_DEV_SUBDOMAIN" \
              '.success == true and .result.subdomain == $expected' "$response_file" > /dev/null; then
              echo "Could not register the workers.dev subdomain (HTTP \${http_status})." >&2
              exit 1
            fi
            echo "workers.dev subdomain registered."
          fi
      - name: Apply additive D1 migrations
        run: npx wrangler d1 migrations apply gijutu-turi-collections --remote
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy to Cloudflare Workers
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/wrangler-deploy.log"
          npx wrangler deploy 2>&1 | tee "$deploy_log"
          worker_url="$(grep -m 1 -Eo 'https://[[:alnum:].-]+\\.workers\\.dev' "$deploy_log")"
          if [ -z "$worker_url" ]; then
            echo "Wrangler did not report a workers.dev URL." >&2
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test production Worker
        env:
          WORKER_URL: \${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for endpoint in /health /ready; do
            curl --fail --show-error --silent --retry 8 --retry-delay 2 --retry-connrefused "$WORKER_URL$endpoint"
          done
          curl --fail --show-error --silent "$WORKER_URL/" -o "$RUNNER_TEMP/gijutu-turi-index.html"
          grep -qi '<html' "$RUNNER_TEMP/gijutu-turi-index.html"
