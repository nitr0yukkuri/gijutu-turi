name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  verify:
    name: 型検査・テスト・ビルド
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: 型検査
        run: npm run typecheck

      - name: 自動テスト
        run: npm test

      - name: 海釣り統合テスト
        run: npm run test:ocean

      - name: 魚モデル検証
        run: npm run test:fish

      - name: クジラモデル検証
        run: npm run test:whale

      - name: 本番ビルド
        run: npm run build

      - name: Dockerイメージをビルド
        run: docker build --tag gijutu-turi:ci .
